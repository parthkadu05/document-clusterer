{% extends 'base.html' %}
{% block content %}
<div class="auth-wrapper" style="position: relative; overflow: hidden;">
    <div id="particles-js" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 0;"></div>
    <div class="glass-card auth-card" style="z-index: 1;">
        <h2 id="welcome-text">Create Account</h2>
        <p class="subtitle">Join DendroDoc today</p>
        
        <form method="POST" action="/signup" class="auth-form">
            <div class="input-group">
                <input type="text" name="username" id="username" required placeholder=" ">
                <label for="username">Username</label>
            </div>
            <div class="input-group">
                <input type="password" name="password" id="password" required placeholder=" ">
                <label for="password">Password</label>
            </div>
            <button type="submit" class="btn-primary auth-btn">Sign Up</button>
        </form>
        
        <p class="auth-footer">Already have an account? <a href="/login">Log in</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#10b981" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": false },
                "size": { "value": 3, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#10b981", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" }, "resize": true },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } }, "push": { "particles_nb": 4 } }
            },
            "retina_detect": true
        });

        if (typeof gsap !== 'undefined') {
            gsap.from('#welcome-text', { duration: 1.5, text: "", opacity: 0, ease: "power2.out" });
        }
    });
</script>
{% endblock %}
